name: 'esigner-codesign'

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm --version && node --version
          npm install
          npm run all

  sign:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign1.ps1

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign1.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: sign1.ps1-${{ matrix.os }}
          path: ./artifacts/codesign1.ps1

  sign-v2:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign2.ps1

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign2.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M
          signing_method: v2

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: sign2.ps1-${{ matrix.os }}
          path: ./artifacts/codesign2.ps1

  sign-input-space:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign', 'sign-v2']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          cp "./sample/sample file.exe" "${GITHUB_WORKSPACE}/example/sample file1.exe"
          cp "./sample/sample file.exe" "${GITHUB_WORKSPACE}/example/sample file2.exe"

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/sample file1.exe
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/sample file2.exe
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M
          signing_method: v2

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: sign-space1.exe-${{ matrix.os }}
          path: ./artifacts/sample file1.exe

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: sign-space2.exe-${{ matrix.os }}
          path: ./artifacts/sample file2.exe

  sign-override:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign', 'sign-v2', 'sign-input-space']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign2.ps1

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign1.ps1
          malware_block: false
          override: true
          environment_name: TEST
          clean_logs: true

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign2.ps1
          malware_block: false
          override: true
          environment_name: TEST
          clean_logs: true
          signing_method: v2

      - name: Upload Signed Files (1)
        uses: actions/upload-artifact@v4
        with:
          name: sign-override1.ps1-${{ matrix.os }}
          path: ./example/codesign1.ps1

      - name: Upload Signed Files (2)
        uses: actions/upload-artifact@v4
        with:
          name: sign-override2.ps1-${{ matrix.os }}
          path: ./example/codesign2.ps1

  sign-external:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign', 'sign-v2', 'sign-input-space', 'sign-override']
    steps:
      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign2.ps1

      - uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign1.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M

      - uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign2.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M
          signing_method: v2

      - name: Upload Signed Files (1)
        uses: actions/upload-artifact@v4
        with:
          name: sign-external1.ps1-${{ matrix.os }}
          path: ./artifacts/codesign1.ps1

      - name: Upload Signed Files (2)
        uses: actions/upload-artifact@v4
        with:
          name: sign-external2.ps1-${{ matrix.os }}
          path: ./artifacts/codesign2.ps1

  sign-multi-same-job:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign', 'sign-v2', 'sign-input-space', 'sign-override', 'sign-external']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com!"' > ${GITHUB_WORKSPACE}/example/codesign2.ps1

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign1.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/codesign2.ps1
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M
          signing_method: v2

      - name: Upload Signed Files (1)
        uses: actions/upload-artifact@v4
        with:
          name: sign3.ps1-${{ matrix.os }}
          path: ./artifacts/codesign1.ps1

      - name: Upload Signed Files (2)
        uses: actions/upload-artifact@v4
        with:
          name: sign4.ps1-${{ matrix.os }}
          path: ./artifacts/codesign2.ps1

  sign-nupkg:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['build', 'sign', 'sign-v2', 'sign-input-space', 'sign-override', 'sign-external', 'sign-multi-same-job']
    steps:
      - uses: actions/checkout@v4

      - name: Create Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          cp "./sample/minimal.1.0.0.nupkg" "${GITHUB_WORKSPACE}/example/minimal.1.0.0.nupkg"

      - uses: ./
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/example/minimal.1.0.0.nupkg
          output_path: ${GITHUB_WORKSPACE}/artifacts
          malware_block: false
          environment_name: TEST
          jvm_max_memory: 2048M

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: sign1.nupkg-${{ matrix.os }}
          path: ./artifacts/minimal.1.0.0.nupkg

  batch-sign:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['sign', 'sign-v2', 'sign-input-space', 'sign-override', 'sign-external', 'sign-multi-same-job', 'sign-nupkg']
    steps:
      - uses: actions/checkout@v4

      - name: Create multiple Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 1!"' > ${GITHUB_WORKSPACE}/example/batch1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 2!"' > ${GITHUB_WORKSPACE}/example/batch2.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 3!"' > ${GITHUB_WORKSPACE}/example/batch3.ps1
          cp "./sample/minimal.exe" "${GITHUB_WORKSPACE}/example/minimal.exe"
          cp "./sample/minimal.msi" "${GITHUB_WORKSPACE}/example/minimal.msi"
          cp "./sample/sample file.exe" "${GITHUB_WORKSPACE}/example/sample file.exe"

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          jvm_max_memory: 4096M

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          jvm_max_memory: 4096M
          signing_method: v2

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: batch-sign-${{ matrix.os }}
          path: ./artifacts

  batch-sign-scan-code:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['batch-sign']
    steps:
      - uses: actions/checkout@v4

      - name: Create multiple Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 1!"' > ${GITHUB_WORKSPACE}/example/batch1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 2!"' > ${GITHUB_WORKSPACE}/example/batch2.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 3!"' > ${GITHUB_WORKSPACE}/example/batch3.ps1
          cp "./sample/minimal.exe" "${GITHUB_WORKSPACE}/example/minimal.exe"
          cp "./sample/minimal.msi" "${GITHUB_WORKSPACE}/example/minimal.msi"
          cp "./sample/sample file.exe" "${GITHUB_WORKSPACE}/example/sample file.exe"

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          malware_block: true
          jvm_max_memory: 4096M

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          malware_block: true
          jvm_max_memory: 4096M
          signing_method: v2

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: batch-sign1-${{ matrix.os }}
          path: ./artifacts

  batch-sign-credential-id:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    needs: ['batch-sign', 'batch-sign-scan-code']
    steps:
      - uses: actions/checkout@v4

      - name: Create multiple Input file for test signing
        shell: bash
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/example
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 1!"' > ${GITHUB_WORKSPACE}/example/batch1.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 2!"' > ${GITHUB_WORKSPACE}/example/batch2.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 3!"' > ${GITHUB_WORKSPACE}/example/batch3.ps1
          echo 'Write-Output -InputObject "Happy Signing From ESigner.com for Batch Sign 4!"' > ${GITHUB_WORKSPACE}/example/batch4.ps1
          cp "./sample/minimal.exe" "${GITHUB_WORKSPACE}/example/minimal.exe"
          cp "./sample/minimal.msi" "${GITHUB_WORKSPACE}/example/minimal.msi"
          cp "./sample/sample file.exe" "${GITHUB_WORKSPACE}/example/sample file.exe"

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          jvm_max_memory: 4096M

      - uses: ./
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}/example
          output_path: ${GITHUB_WORKSPACE}/artifacts
          environment_name: TEST
          jvm_max_memory: 4096M
          signing_method: v2

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: batch-sign2-${{ matrix.os }}
          path: ./artifacts
